bindd = SUPER, 0, speech 0, exec, speech.sh 0
bindd = SUPER, 1, speech 1, exec, speech.sh 1
bindd = SUPER, 2, speech 2, exec, speech.sh 2
bindd = SUPER, 3, speech 3, exec, speech.sh 3
bindd = SUPER, 4, speech 4, exec, speech.sh 4
bindd = SUPER, 5, speech 5, exec, speech.sh 5
bindd = SUPER, 6, speech 6, exec, speech.sh 6
bindd = SUPER, 7, speech 7, exec, speech.sh 7
bindd = SUPER, 8, speech 8, exec, speech.sh 8
bindd = SUPER, 9, speech 9, exec, speech.sh 9

bindd = SUPER, Delete, enter kill mode, exec, hyprctl kill

# Laptop multimedia keys for volume and LCD brightness
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 1%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 1%-
bindel = , XF86DisplayToggle, exec, hyprctl dispatch dpms toggle

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Move focus with mainMod + arrow keys
bindd = SUPER, left, move focus left, movefocus, l
bindd = SUPER, right, move focus right, movefocus, r
bindd = SUPER, up, move focus up, movefocus, u
bindd = SUPER, down, move focus down, movefocus, d

# Move window with mainMod + SHIFT + arrow keys
bindd = SUPER SHIFT, left, move window left, movewindow, l
bindd = SUPER SHIFT, right, move window right, movewindow, r
bindd = SUPER SHIFT, up, move window up, movewindow, u
bindd = SUPER SHIFT, down, move window down, movewindow, d

# Move window or group with mainMod + CTRL + arrow keys
bindd = SUPER CTRL, left, move window/group left, movewindoworgroup, l
bindd = SUPER CTRL, right, move window/group right, movewindoworgroup, r
bindd = SUPER CTRL, up, move window/group up, movewindoworgroup, u
bindd = SUPER CTRL, down, move window/group down, movewindoworgroup, d

bindd = SUPER, insert, notify layer switch, exec, hyprctl notify -1 1000 "rgb(ff1ea3)" "Layer Switched."

bindd = SUPER, grave, enter clean mode, submap, clean
submap = clean
bind = SUPER, grave, submap, reset
bind = , catchall, exec, hyprctl notify -1 1000 "rgb(ff1ea3)" "Try again after unlocking the map."
submap = reset

# Screenshots and screen recording
bindd = SUPER, apostrophe, capture full screen, exec, record.sh capture full
bindd = SUPER SHIFT, apostrophe, record full screen, exec, record.sh record full
bindd = SUPER CTRL, apostrophe, capture active window, exec, record.sh capture window-active
bindd = SUPER SHIFT CTRL, apostrophe, record active window, exec, record.sh record window-active
bindd = SUPER ALT, apostrophe, capture selected area, exec, record.sh capture select
bindd = SUPER SHIFT ALT, apostrophe, record selected area, exec, record.sh record select
bindd = SUPER CTRL ALT, apostrophe, capture selected window, exec, record.sh capture window-select
bindd = SUPER SHIFT CTRL ALT, apostrophe, record selected window, exec, record.sh record window-select

bindd = SUPER, return, open wifi control, exec, pkill iwctl || kitty iwctl
bindd = SUPER SHIFT, return, open bluetooth control, exec, pkill bluetoothctl || kitty bluetoothctl

bindd = SUPER, tab, open config list with nvim, exec, $te sh -c 'cd ~/.config/home-manager; config="`git ls-files | fzf -m`" && nvim $config -O'
bindd = SUPER SHIFT , tab, open config list with yazi, exec, $te sh -c 'cd ~/.config/home-manager; config="`git ls-files | fzf -m`" && yazi $config'
bindd = SUPER CTRL, tab, edit crontab, exec, $te crontab -e
bindd = SUPER SHIFT CTRL, tab, edit anacrontab, exec, $te sudo nvim /etc/anacrontab
bindd = SUPER ALT, tab, open keyboard programmer, exec, vial
bindd = SUPER CTRL ALT, tab, reload home config, exec, $sw $te home-manager switch; hyprctl reload
bindd = SUPER SHIFT CTRL ALT, tab, rebuild NixOS config, exec, $sw $te rebuild_nixos.sh

bindd = SUPER, F1, open Desktop, exec, $te yazi Desktop
bindd = SUPER, F2, open Downloads, exec, $te yazi Downloads
bindd = SUPER, F3, open Documents, exec, $te yazi Documents
bindd = SUPER, F4, open Public, exec, $te yazi Public
bindd = SUPER, F5, open Music, exec, $te yazi Music
bindd = SUPER, F6, open Pictures, exec, $te yazi Pictures
bindd = SUPER, F7, open Videos, exec, $te yazi Videos
bindd = SUPER, F8, open Templates, exec, $te yazi Templates
bindd = SUPER, F9, open home, exec, $te yazi ~
bindd = SUPER, F10, open root, exec, $te yazi /
