execr-once = get_vitals.py
execr-once = socket.sh
execr-once = strip_exports.sh
execr-once = phone_automation.sh
execr-once = hyprctl output create headless
execr-once = hyprctl keyword monitor Virtual-1,disable
execr-once = wayvnc -L trace 0.0.0.0 5900

exec-once = [workspace name:󰔊 silent] $te sh -c 'while true; do run_project.sh SenseStream; done'
exec-once = [workspace special: silent] $te --listen-on unix:/tmp/agent claude -r f75051a3-aef2-4576-bf7a-497c2dd0117e
exec-once = [float; pin; size 200 200; move 1700 440] $te watch -n 1 "sqlite3 ~/.log.db \"SELECT (id % 10), substr(content, 1, 10) FROM speech WHERE id > (SELECT MAX(id) FROM speech) - 10 ORDER BY (id % 10);\""
exec-once = [float; pin; size 800 300; move 1100 140] $te --hold sh -c 'while true; do clear; cat ~/README.md; inotifywait -q -e modify ~/README.md; done'
exec-once = [workspace special:󰋼 silent] $te mihomo -d .config/mihomo
exec-once = [workspace special:󰋼 silent] $te journalctl -f
