# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = SUPER, bracketleft, exec, $te
bind = SUPER, bracketright, exec, $al
bind = SUPER SHIFT, bracketleft, exec, pkill iwctl || $te iwctl
bind = SUPER SHIFT, bracketright, exec, pkill bluetoothctl || $te bluetoothctl
bind = SUPER, Backspace, killactive
bind = SUPER, Delete, exec, hyprctl kill
bind = SUPER, Return, fullscreen
bind = SUPER, Space, togglefloating
bind = SUPER, backslash, pseudo
bind = SUPER, slash, togglesplit

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindel = ,XF86DisplayToggle, exec, hyprctl dispatch dpms toggle

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Move focus with mainMod + arrow keys
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Move window with mainMod + SHIFT + arrow keys
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = SUPER, 3, workspace, name:🖧
bind = SUPER, 4, workspace, name:󰍡
bind = SUPER, 0, workspace, name:󰚀

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = SUPER SHIFT, 3, movetoworkspace, name:🖧
bind = SUPER SHIFT, 4, movetoworkspace, name:󰍡
bind = SUPER SHIFT, 0, movetoworkspace, name:󰚀

bind = SUPER, insert, exec, hyprctl notify -1 1000 "rgb(ff1ea3)" "Layer Switched."

bind = SUPER, grave, submap, clean
submap = clean
bind = SUPER, grave, submap, reset
bind = , catchall, exec, hyprctl notify -1 1000 "rgb(ff1ea3)" "Try again after unlocking the map."
submap = reset

# Screenshots
bind = SUPER, apostrophe, exec, ~/.utils/record.sh capture full
bind = SUPER SHIFT, apostrophe, exec, ~/.utils/record.sh record full
bind = SUPER CTRL, apostrophe, exec, ~/.utils/record.sh capture window-active
bind = SUPER SHIFT CTRL, apostrophe, exec, ~/.utils/record.sh record window-active
bind = SUPER ALT, apostrophe, exec, ~/.utils/record.sh capture select
bind = SUPER SHIFT ALT, apostrophe, exec, ~/.utils/record.sh record select
bind = SUPER CTRL ALT, apostrophe, exec, ~/.utils/record.sh capture window-select
bind = SUPER SHIFT CTRL ALT, apostrophe, exec, ~/.utils/record.sh record window-select

# Machine states
bind = SUPER, comma, exec, hyprlock
bind = SUPER SHIFT, comma, exit
bind = SUPER, semicolon, exec, systemctl suspend
bind = SUPER SHIFT, semicolon, exec, systemctl hibernate
bind = SUPER, period, exec, systemctl reboot
bind = SUPER SHIFT, period, exec, systemctl poweroff

bind = SUPER, tab, exec, $te ranger ~/.config
bind = SUPER SHIFT, tab, exec, ~/Desktop/Vial-v0.7.1-x86_64.AppImage
bind = SUPER CTRL, tab, exec, $te crontab -e
bind = SUPER SHIFT CTRL, tab, exec, $te sudo nvim /etc/anacrontab

bind = SUPER, F1, exec, $te ranger Desktop
bind = SUPER, F2, exec, $te ranger Downloads
bind = SUPER, F3, exec, $te ranger Documents
bind = SUPER, F4, exec, $te ranger Public
bind = SUPER, F5, exec, $te ranger Music
bind = SUPER, F6, exec, $te ranger Pictures
bind = SUPER, F7, exec, $te ranger Videos
bind = SUPER, F8, exec, $te ranger Templates
bind = SUPER, F9, exec, $te ranger ~
bind = SUPER, F10, exec, $te ranger /

bind = SUPER, e, exec, $te euporie notebook

# Fit well with knob turing (as undo & redo) of my Mir T5+ keyboard layer 1
bind = , redo, sendshortcut, , down,
bind = , undo, sendshortcut, , up,
bind = SHIFT, redo, sendshortcut, , right,
bind = SHIFT, undo, sendshortcut, , left,
bind = ALT, redo, sendshortcut, , next,
bind = ALT, undo, sendshortcut, , prior,
bind = SHIFT ALT, redo, sendshortcut, , end,
bind = SHIFT ALT, undo, sendshortcut, , home,
bind = CTRL, redo, sendshortcut, , delete,
bind = CTRL, undo, sendshortcut, , backspace,
bind = SHIFT CTRL, redo, sendshortcut, , code:36, # return
bind = SHIFT CTRL, undo, sendshortcut, , code:23, # cannot use tab directly due to an unknown issue
bind = SUPER, redo, sendshortcut, , redo,
bind = SUPER, undo, sendshortcut, , undo,
bind = SUPER ALT, redo, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bind = SUPER ALT, undo, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bind = SUPER SHIFT ALT, redo, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 1%+
bind = SUPER SHIFT ALT, undo, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 1%-
bind = SUPER CTRL, redo, exec, brightnessctl s 1%+
bind = SUPER CTRL, undo, exec, brightnessctl s 1%-
bind = SUPER SHIFT CTRL, redo, exec, playerctl next
bind = SUPER SHIFT CTRL, undo, exec, playerctl previous

# Fit well with knob pressing (as pause) of my Mir T5+ keyboard layer 1
bind = , pause, sendshortcut, , escape,
bind = SHIFT, pause, sendshortcut, , pause,
bindl = ALT, pause, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = SHIFT ALT, pause, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = CTRL, pause, exec, hyprctl dispatch dpms toggle
bindl = SHIFT CTRL, pause, exec, playerctl play-pause
bindl = SUPER, pause, exec, hyprlock
bindl = SUPER SHIFT, pause, exit
bindl = SUPER ALT, pause, exec, systemctl suspend
bindl = SUPER CTRL, pause, exec, systemctl hibernate
bindl = SUPER CTRL ALT, pause, exec, systemctl reboot
bindl = SUPER SHIFT CTRL ALT, pause, exec, systemctl poweroff

bindr = SUPER, SUPER_L, exec, $te "`~/.utils/path.sh`"
bindr = SHIFT SUPER, SUPER_L, exec, $te nvim "`~/.utils/path.sh`"
bindr = ALT SUPER, SUPER_L, exec, $te ranger "`~/.utils/path.sh`"
bindr = CTRL SUPER, SUPER_L, exec, $te btop
bindr = SHIFT ALT SUPER, SUPER_L, exec, $al
bindr = SHIFT CTRL SUPER, SUPER_L, exec, nyxt
bindr = CTRL ALT SUPER, SUPER_L, exec, pkill iwctl || $te iwctl
bindr = SHIFT CTRL ALT SUPER, SUPER_L, exec, pkill bluetoothctl || $te bluetoothctl

bindr = SUPER SHIFT, SHIFT_L, exec, ~/.utils/binds.sh
bindr = ALT SHIFT, SHIFT_L, exec, ~/.utils/speak.sh simple
bindr = CTRL SHIFT, SHIFT_L, exec, ~/.utils/speak.sh complex
bindr = CTRL ALT SHIFT, SHIFT_L, exec, $sw ~/.utils/unicode.sh

bindr = SUPER CTRL, CONTROL_L, togglespecialworkspace, log
bindr = SHIFT CTRL, CONTROL_L, togglespecialworkspace, card
bindr = ALT CTRL, CONTROL_L, togglespecialworkspace, memo
bindr = SUPER SHIFT CTRL, CONTROL_L, focuscurrentorlast
bindr = SUPER ALT CTRL, CONTROL_L, exec, pkill waybar || waybar

bindr = SUPER ALT, ALT_L, exec, $sw ~/.utils/explore.sh
bindr = SHIFT ALT, ALT_L, exec, $sw ~/.utils/execs.sh
bindr = CTRL ALT, ALT_L, exec, $sw ~/.utils/rename.sh
bindr = SUPER SHIFT ALT, ALT_L, exec, ~/RWKV/RWKV-Runner_linux_x64
