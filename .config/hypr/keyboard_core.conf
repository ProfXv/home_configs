# Mod-only binds, work well with my Mir T5+ keyboard layer 1
binddr = SUPER, SUPER_L, open terminal, exec, $env $te
binddr = SHIFT SUPER, SUPER_L, open editor, exec, $env $te nvim README.md
binddr = ALT SUPER, SUPER_L, open file manager, exec, $env $te yazi
binddr = CTRL SUPER, SUPER_L, open system monitor, exec, $te btop
binddr = SHIFT ALT SUPER, SUPER_L, toggle launcher, exec, pkill wofi || wofi
binddr = SHIFT CTRL SUPER, SUPER_L, open browser, exec, firefox --new-window
binddr = CTRL ALT SUPER, SUPER_L, open Jupyter notebook, exec, $env $te euporie-notebook main.ipynb
binddr = SHIFT CTRL ALT SUPER, SUPER_L, open Mathematica notebook, exec, $env mathematica-notebook main.nb

binddr = SUPER SHIFT, SHIFT_L, open virtual keyboard, exec, binds.sh
binddr = ALT SHIFT, SHIFT_L, simple voice input, exec, speak.sh simple
binddr = CTRL SHIFT, SHIFT_L, complex voice input, exec, speak.sh complex
binddr = CTRL ALT SHIFT, SHIFT_L, toggle unicode input, exec, $sw pkill unicode.sh || $te unicode.sh
binddr = SUPER ALT SHIFT, SHIFT_L, voice commands, exec, voice_commands.sh

binddr = SUPER CTRL, CONTROL_L, check system log, togglespecialworkspace, log
binddr = SHIFT CTRL, CONTROL_L, view daily card, togglespecialworkspace, card
binddr = SUPER SHIFT CTRL, CONTROL_L, toggle status bar, exec, pkill waybar || waybar
binddr = SUPER ALT CTRL, CONTROL_L, open magnifier, exec, woomer
binddr = SHIFT ALT CTRL, CONTROL_L, annotate screen, exec, grim - | satty -f - --fullscreen

binddr = SUPER ALT, ALT_L, select webpage, exec, $sw $env pkill explore.sh || $te explore.sh
binddr = SHIFT ALT, ALT_L, execute command, exec, $sw pkill execs.sh || $te execs.sh
binddr = CTRL ALT, ALT_L, rename workspace, exec, $sw pkill rename.sh || $te rename.sh
binddr = SUPER SHIFT ALT, ALT_L, save webpage, exec, $env save.sh
binddr = SUPER CTRL ALT, ALT_L, open large language model interface, exec, ~/Desktop/Projects/theirs/RWKV/RWKV-Runner_linux_x64

# Fit well with knob turning (as undo & redo) of my Mir T5+ keyboard layer 1
bind = , redo, sendshortcut, , down,
bind = , undo, sendshortcut, , up,
bind = SHIFT, redo, sendshortcut, , right,
bind = SHIFT, undo, sendshortcut, , left,
bind = ALT, redo, sendshortcut, , next,
bind = ALT, undo, sendshortcut, , prior,
bind = SHIFT ALT, redo, sendshortcut, , end,
bind = SHIFT ALT, undo, sendshortcut, , home,
bind = CTRL, redo, sendshortcut, , delete,
bind = CTRL, undo, sendshortcut, , backspace,
bind = SHIFT CTRL, redo, sendshortcut, , code:36, # return
bind = SHIFT CTRL, undo, sendshortcut, , code:23, # cannot use tab directly due to an unknown issue
bind = SUPER, redo, sendshortcut, , redo,
bind = SUPER, undo, sendshortcut, , undo,
bind = SUPER ALT, redo, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bind = SUPER ALT, undo, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bind = SUPER SHIFT ALT, redo, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 1%+
bind = SUPER SHIFT ALT, undo, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 1%-
bind = SUPER CTRL, redo, exec, brightnessctl s 1%+
bind = SUPER CTRL, undo, exec, brightnessctl s 1%-
bind = SUPER SHIFT CTRL, redo, exec, playerctl next
bind = SUPER SHIFT CTRL, undo, exec, playerctl previous

# Fit well with knob pressing (as pause) of my Mir T5+ keyboard layer 1
# bind = , pause, sendshortcut, , escape,
bind = SHIFT, pause, sendshortcut, , pause,
bindl = ALT, pause, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = SHIFT ALT, pause, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = CTRL, pause, exec, hyprctl dispatch dpms toggle
bindl = SHIFT CTRL, pause, exec, playerctl play-pause
bindl = SUPER, pause, exec, hyprlock
bindl = SUPER SHIFT, pause, exit
bindl = SUPER ALT, pause, exec, systemctl suspend
bindl = SUPER CTRL, pause, exec, systemctl hibernate
bindl = SUPER CTRL ALT, pause, exec, systemctl reboot
bindl = SUPER SHIFT CTRL ALT, pause, exec, systemctl poweroff


